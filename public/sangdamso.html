<style>
:root{
  --navy:#14213D; --brand:#1F4E79; --blue:#1976D2; --blue-d:#1565C0; --blue-soft:#E3F0FC;
  --ink:#111827; --sub:#3D4A63; --muted:#5B6680; --line:#E6EAF0; --line2:#DDE2EA;
  --bg:#FFFFFF; --bg2:#F5F7FA; --card:#FFFFFF; --warn:#B42318; --ok:#1E7B4B; --ok-soft:#E7F5EE; --amber:#8A5300; --amber-soft:#FFF5E1;
  --f:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#E8EEF8;--brand:#5B8FC4;--blue:#64A9EE;--blue-d:#90CAF9;--blue-soft:#17283D;
  --ink:#EDF0F5;--sub:#C2CAD8;--muted:#98A3B8;--line:#273246;--line2:#2E3A50;
  --bg:#0E1420;--bg2:#131B2A;--card:#172133;--warn:#F08A80;--ok:#6FD3A0;--ok-soft:#143326;--amber:#F2C46B;--amber-soft:#2E2615;color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#E8EEF8;--brand:#5B8FC4;--blue:#64A9EE;--blue-d:#90CAF9;--blue-soft:#17283D;
  --ink:#EDF0F5;--sub:#C2CAD8;--muted:#98A3B8;--line:#273246;--line2:#2E3A50;
  --bg:#0E1420;--bg2:#131B2A;--card:#172133;--warn:#F08A80;--ok:#6FD3A0;--ok-soft:#143326;--amber:#F2C46B;--amber-soft:#2E2615;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* 패밀리 바 · 헤더 */
.family{border-bottom:1px solid var(--line);font-size:13px;background:var(--bg)}
.family .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;flex-wrap:wrap;padding-block:6px}
.family b{color:var(--brand)}
.family nav{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.family nav a{text-decoration:none}
.family nav a:hover{color:var(--ink)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.logo{background:none;border:0;padding:0;text-align:left;line-height:1.15}
.logo strong{display:block;font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.logo strong em{font-style:normal;color:var(--blue)}
.logo small{font-size:12px;color:var(--muted)}
.mainnav{display:flex;align-items:center;gap:28px;font-weight:700;color:var(--sub);font-size:15.5px}
.mainnav button.link{background:none;border:0;padding:8px 0}
.mainnav button.link:hover{color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;font-weight:700;min-height:48px;padding:0 22px;text-decoration:none;font-size:16px}
.btn.blue{background:var(--blue);color:#fff}.btn.blue:hover{background:var(--blue-d)}
.btn.navy{background:var(--brand);color:#fff}
.btn.line{background:var(--card);border:1.5px solid var(--line2);color:var(--sub)}
.btn.lg{min-height:58px;font-size:17px;padding:0 30px}
@media (max-width:760px){.mainnav .link{display:none}.mainnav{gap:0}.family nav{display:none}}

/* 섹션 공통 */
section{padding:72px 0}
section.alt{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.eyebrow{color:var(--blue);font-weight:700;font-size:15px;margin:0 0 10px}
h1,h2,h3{color:var(--navy);letter-spacing:-.025em;margin:0}
h2{font-size:clamp(24px,3.2vw,32px);font-weight:800;line-height:1.3}
.lead{color:var(--muted);margin:10px 0 0;font-size:16.5px}

/* 히어로 */
.hero{padding:64px 0 72px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(32px,4.6vw,46px);font-weight:800;line-height:1.22}
.hero p.desc{color:var(--sub);font-size:18px;margin:22px 0 32px;max-width:34em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .micro{color:var(--muted);font-size:14px;margin:16px 0 0}
.panel{background:var(--card);border:1px solid var(--line2);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.panel .ph{background:#14213D;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;font-weight:700;font-size:15px}
.panel .ph span{font-weight:500;opacity:.8;font-size:13px}
.toplist{list-style:none;margin:0;padding:8px 0}
.toplist button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:16px 24px;min-height:64px}
.toplist li:first-child button{border-top:0}
.toplist button:hover{background:var(--bg2)}
.toplist .n{font-weight:800;font-size:22px;color:var(--blue)}
.toplist .q{font-weight:700;color:var(--navy);line-height:1.45}
.toplist .go{font-size:13px;color:var(--blue);font-weight:700;white-space:nowrap}
.panel .pf{padding:14px 24px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:36px}.hero{padding:40px 0 56px}}

/* 고민 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:32px}
.tile{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:22px 22px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(25,118,210,.10);transform:translateY(-2px)}
.tile .k{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.tile .t{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.tile .ex{font-size:14px;color:var(--muted);line-height:1.5}
.tile .st{margin-top:auto;font-size:13.5px;font-weight:700;color:var(--muted)}
.tile .st.on{color:var(--blue)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.hot{background:var(--blue-soft);color:var(--blue)}

/* 노무사 소개 */
.who{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
.who img{width:200px;height:260px;object-fit:cover;border-radius:14px;background:var(--line)}
.who h2{margin-top:4px}
.who .cred{color:var(--muted);margin:6px 0 0}
.who blockquote{margin:18px 0 0;font-size:19px;font-weight:700;color:var(--navy);line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:2px solid var(--navy);margin-top:28px}
.facts div{padding:14px 0;border-bottom:1px solid var(--line);padding-right:12px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;color:var(--ink)}
@media (max-width:760px){.who{grid-template-columns:minmax(0,1fr);gap:20px}.who img{width:140px;height:182px}.facts{grid-template-columns:minmax(0,1fr)}}

/* 3카드 · 단계 */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px}
.box{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:26px}
.box .k{color:var(--blue);font-weight:700;font-size:14px}
.box h3{font-size:19px;margin:8px 0 8px}
.box p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:760px){.three{grid-template-columns:minmax(0,1fr)}}

/* FAQ */
.faq{margin-top:28px;border-top:2px solid var(--navy)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:20px 4px;font-weight:700;color:var(--navy);font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(180deg)}
.faq p{margin:0 4px 20px;color:var(--sub)}

/* CTA 밴드 · 푸터 */
.band{background:#14213D;color:#fff;text-align:center;padding:64px 0}
.band h2{color:#fff}
.band p{color:rgba(255,255,255,.75);margin:12px 0 28px}
.fam{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.fam a{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:18px}
.fam a:hover{border-color:var(--blue)}
.fam b{color:var(--navy);font-size:17px}
.fam b em{font-style:normal;color:var(--blue)}
.fam span{display:block;font-weight:700;font-size:14px;margin-top:2px}
.fam small{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
@media (max-width:860px){.fam{grid-template-columns:repeat(2,minmax(0,1fr))}}
footer{background:var(--bg2);border-top:1px solid var(--line);padding:40px 0 96px;font-size:13px;color:var(--muted)}
footer p{margin:4px 0}
.float{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:0 24px;min-height:58px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(20,33,61,.25)}

/* ── 답 카드 화면 (진단 화면 문법) ── */
.progress{border-bottom:1px solid var(--line);background:var(--bg)}
.progress .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
.progress .bar{flex:1;min-width:0}
.progress .row{display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:var(--navy)}
.progress .row b{color:var(--blue)}
.track{height:8px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.stage{background:var(--bg2);padding:36px 0 120px;min-height:70vh}
.stage .wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.side h4{margin:0 0 12px;font-size:14px;color:var(--muted)}
.side ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line2);border-radius:14px;overflow:hidden}
.side li button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:15px 18px;font-size:15px;color:var(--sub)}
.side li:first-child button{border-top:0}
.side li button.on{background:var(--blue-soft);color:var(--navy);font-weight:700}
.side li button span{color:var(--muted);font-size:13px;font-weight:700}
.side .hint{font-size:13px;color:var(--muted);margin:14px 2px 0}
@media (max-width:860px){.stage .wrap{grid-template-columns:minmax(0,1fr)}.side{display:none}}
.qcard{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:40px 44px}
@media (max-width:600px){.qcard{padding:26px 20px}}
.qcard .k{color:var(--blue);font-weight:700;font-size:15px}
.qcard h1{font-size:clamp(23px,3vw,28px);font-weight:800;line-height:1.35;margin:10px 0 0}
.qcard .heart{color:var(--muted);margin:10px 0 0}
.basis{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;margin-top:24px}
.basis .r{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:16px 22px;border-top:1px solid var(--line)}
.basis .r:first-child{border-top:0}
.basis .r dt{font-size:14px;font-weight:700;color:var(--muted);padding-top:2px}
.basis .r dt.a{color:var(--blue)}
.basis .r dd{margin:0}
.basis .ans{font-size:17.5px;font-weight:500;color:var(--ink);line-height:1.7}
.basis .ans mark{background:linear-gradient(transparent 55%,rgba(25,118,210,.22) 55%);color:inherit;font-weight:700;padding:0 2px}
.basis .ref{font-size:14.5px;color:var(--sub)}
.basis .ref small{color:var(--muted)}
@media (max-width:600px){.basis .r{grid-template-columns:minmax(0,1fr);gap:4px;padding:14px 16px}}
.todo-h{display:flex;justify-content:space-between;align-items:baseline;margin:32px 0 12px}
.todo-h h3{font-size:18px}
.todo-h span{font-weight:700;color:var(--blue);font-size:15px}
.opt{display:flex;flex-direction:column;gap:10px}
.opt label{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:14px;align-items:center;border:1.5px solid var(--line2);border-radius:12px;padding:16px 22px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.opt label:hover{border-color:var(--blue)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .tx{font-weight:700;color:var(--navy)}
.opt .tx small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.opt .ck{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;font-weight:800;transition:all .15s}
.opt label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.opt input:checked ~ .ck{background:var(--blue);border-color:var(--blue);color:#fff}
.opt input:focus-visible ~ .ck{outline:3px solid var(--blue);outline-offset:2px}
.goal{margin-top:16px;border-radius:12px;padding:18px 22px;background:var(--bg2);border:1px dashed var(--line2)}
.goal b{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.goal.done{background:var(--ok-soft);border:1px solid transparent}
.goal.done b{color:var(--ok)}
.seal{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:var(--ok);font-size:16px;margin-bottom:6px}
.seal i{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.acc{margin-top:28px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:16px 2px;font-weight:700;color:var(--navy)}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"▾";color:var(--muted)}
.acc details[open] summary::after{content:"▴"}
.acc .in{padding:0 2px 18px;color:var(--sub)}
.acc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.acc details.sos summary{color:var(--amber)}
.ox .stmt{font-weight:700;color:var(--ink);margin:0 0 12px}
.ox .b2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .b2 button{border:1.5px solid var(--line2);background:var(--card);border-radius:12px;min-height:54px;font-weight:800;font-size:18px;color:var(--navy)}
.ox .b2 button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ox .b2 button.wrong{border-color:var(--line2);color:var(--muted);text-decoration:line-through}
.ox .exp{margin:12px 0 0;background:var(--bg2);border-radius:10px;padding:12px 16px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav2 .btn[disabled]{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.6}

/* 목록 · 기준판 · 문의 */
.wlist{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.wlist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:18px 22px;min-height:64px;font-weight:700;color:var(--navy)}
.wlist button:hover{border-color:var(--blue)}
.wlist .tag{font-size:12.5px}
.tag.ready{background:var(--blue);color:#fff}
.tag.ask{background:var(--bg2);color:var(--muted);border:1px solid var(--line2)}
.ghost{background:none;border:1.5px dashed var(--line2);border-radius:12px;padding:16px 22px;color:var(--muted);text-align:left;font-weight:700;min-height:58px}
.blist{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.blist li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px 20px}
.blist li i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:var(--bg2);color:var(--muted)}
.blist li.on i{background:var(--ok);color:#fff}
.blist li b{color:var(--navy)}
.blist li small{display:block;color:var(--muted)}
.blist li.on small{color:var(--ok)}
.contact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
.contact a{display:block;text-decoration:none;border:1.5px solid var(--line2);border-radius:12px;padding:20px 22px;background:var(--card)}
.contact a:hover{border-color:var(--blue)}
.contact b{display:block;color:var(--navy);font-size:17px}
.contact span{color:var(--muted);font-size:14px}
@media (max-width:600px){.contact{grid-template-columns:minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40}
@media (max-width:760px){.float{display:none}.mainnav .btn{margin-left:0!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

      <img src="${PHOTO}" alt="조대진 대표노무사" width="200" height="260">
      <div>
        <p class="eyebrow">이 상담소를 만든 사람</p>
        <h2>기준을 세우는 노무사, 조대진</h2>
        <p class="cred">공인노무사 16년 · 안전공학 박사</p>
        <blockquote>“사장님이 부족했던 게 아닙니다. 가게에 기준이 없었을 뿐입니다. 하나씩 세우면 됩니다.”</blockquote>
        <dl class="facts">
          <div><dt>소속</dt><dd>노무법인 위너스 대표노무사</dd></div>
          <div><dt>실무 이력</dt><dd>현대카드 · 삼성서울병원 인사 출신</dd></div>
          <div><dt>학위</dt><dd>안전공학 박사</dd></div>
          <div><dt>전문 분야</dt><dd>노동법 · 산업안전 · 인사제도</dd></div>
        </dl>
      </div>
    </div></section>

    <section class="alt"><div class="wrap">
      <h2>모든 답에 근거를 답니다</h2>
      <p class="lead">일반론이 아니라, 확인할 수 있는 근거로만 답합니다.</p>
      <div class="three">
        <div class="box"><span class="k">근거 1</span><h3>답마다 조문 표기</h3><p>1분 답 아래에 근로기준법·퇴직급여법·고용보험법 해당 조문을 그대로 적습니다.</p></div>
        <div class="box"><span class="k">근거 2</span><h3>사장님 말로 1분</h3><p>법률 용어 대신 사장님이 쓰는 말로, 결론부터 한 문단에 담았습니다.</p></div>
        <div class="box"><span class="k">근거 3</span><h3>확인일 표시</h3><p>답마다 확인한 날짜를 적고, 법이 바뀌면 날짜와 함께 고칩니다.</p></div>
      </div>
    </div></section>

    <section><div class="wrap">
      <h2>1분이면 끝납니다</h2>
      <div class="three">
        <div class="box"><span class="k">1단계</span><h3>고민 고르기</h3><p>지금 마음 쓰이는 일과 가장 가까운 고민 하나를 고르세요.</p></div>
        <div class="box"><span class="k">2단계</span><h3>1분 답 읽기</h3><p>결론과 근거 조문, 많이 하는 오해를 한 화면에서 봅니다.</p></div>
        <div class="box"><span class="k">3단계</span><h3>할 일 3개 체크</h3><p>세 가지를 마치면 우리 가게 기준이 하나 생깁니다.</p></div>
      </div>
    </div></section>

    <section class="alt"><div class="wrap">
      <h2>자주 묻는 질문</h2>
      <div class="faq">
        <details><summary>어떤 곳인가요?</summary><p>직원 문제로 막막한 사장님이 고민 하나를 고르면, 1분 안에 읽을 답과 오늘 할 일 3가지를 드리는 곳입니다. 노무법인 위너스가 만들고 고칩니다.</p></details>
        <details><summary>제 이야기가 어디에 남나요?</summary><p>이름이나 가게 이름을 묻지 않습니다. 할 일 체크 기록은 지금 쓰시는 기기에만 남고, 저희에게 전송되지 않습니다.</p></details>
        <details><summary>답과 제 상황이 조금 달라요</summary><p>답 카드는 일반적인 기준입니다. 각 카드의 '이럴 땐 노무사에게'에 해당하시면 상담을 신청해 주세요. 있었던 일만 말씀하시면 됩니다.</p></details>
        <details><summary>상담은 어떻게 진행되나요?</summary><p>상담 신청서를 남겨 주시면 영업일 3일 안에 연락드립니다. 상담은 유료 자문이며, 비용은 먼저 안내드립니다. 조대진·김지예 노무사 두 사람이 끝까지 맡습니다.</p></details>
      </div>
    </div></section>

    <div class="band"><div class="wrap">
      <h2>혼자 고민하지 마시고, 먼저 30분</h2>
      <p>자료 준비 없이 있었던 일만 말씀해 주세요. 지금 가장 급한 하나를 같이 정합니다. 상담은 유료 자문이며, 신청서 확인 후 비용을 먼저 안내드립니다.</p>
      <button class="btn blue lg" data-nav="#/ask">상담 신청 →</button>
    </div></div>
    ${footer}`;
  }

  function sidebar(activeGroup) {
    return `<aside class="side"><h4>고민 묶음</h4><ul>${GROUPS.map(g=>{ const r=g.worries.filter(w=>w[1]).map(w=>w[1]); const d=r.filter(done).length;
      return `<li><button class="${g.id===activeGroup?"on":""}" data-nav="#/g/${g.id}">${esc(g.t)}<span>${r.length?`${d}/${r.length}`:"묻기"}</span></button></li>`;}).join("")}</ul>
      <p class="hint">숫자는 할 일 3개를 마친 답 카드 수입니다.</p></aside>`;
  }
  function progressBar(label, cur, total) {
    const pct = total ? Math.round(cur/total*100) : 0;
    return `<div class="progress"><div class="wrap">
      <button class="logo" data-nav="#/"><strong>사장님 <em>1분</em> 상담소</strong></button>
      <div class="bar"><div class="row"><span>${label}</span><b>${pct}%</b></div><div class="track"><i style="width:${pct}%"></i></div></div></div></div>`;
  }

  function group(gid) {
    const g = GROUPS.find(x => x.id === gid) || GROUPS[0];
    return `${family}${progressBar(`우리 가게 기준 ${doneCount()} / ${ORDER.length}`, doneCount(), ORDER.length)}
    <div class="stage"><div class="wrap">${sidebar(g.id)}
      <div class="qcard">
        <span class="k">고민 묶음 · ${esc(g.t)}</span>
        <h1>가장 가까운 고민을 골라 주세요</h1>
        <div class="wlist">${g.worries.map(w=>`<button data-nav="${w[1]?`#/c/${w[1]}`:`#/ask?q=${encodeURIComponent(w[0])}`}"><span>${esc(w[0])}</span><span class="tag ${w[1]?(done(w[1])?"ready":"ready"):"ask"}">${w[1]?(done(w[1])?"기준 생김 ✓":"1분 답"):"노무사에게 묻기"}</span></button>`).join("")}
          <button class="ghost" data-nav="#/ask">제 상황은 달라요 → 노무사에게 직접 묻기</button></div>
      </div></div></div>
    ${footer}`;
  }

  function card(no) {
    const c = CARDS[no]; const g = GROUPS.find(x => x.id === c.group);
    const ck = state.checks[no] || [false,false,false]; const n = ck.filter(Boolean).length;
    const i = ORDER.indexOf(no); const prev = ORDER[i-1], next = ORDER[i+1];
    const o = ox[no];
    return `${family}${progressBar(`오늘 할 일 ${n} / 3`, n, 3)}
    <div class="stage"><div class="wrap">${sidebar(g.id)}
      <div>
      <article class="qcard">
        <span class="k">${esc(g.t)} · 1분 답 · No.${no}</span>
        <h1>“${esc(c.q)}”</h1>
        <p class="heart">${esc(c.heart)}</p>
        <dl class="basis">
          <div class="r"><dt class="a">1분 답</dt><dd class="ans">${c.answer}</dd></div>
          <div class="r"><dt>근거</dt><dd class="ref">${esc(c.refs)}<br><small>국가법령정보센터 원문 대조 ${REVIEWED} · 고용노동부 자료 대조</small></dd></div>${c.notice?`<div class="r"><dt style="color:var(--amber)">바뀌는 법</dt><dd class="ref">${esc(c.notice)}</dd></div>`:""}
        </dl>

        <div class="todo-h"><h3>오늘 하실 일</h3><span>${n} / 3</span></div>
        <div class="opt">${c.todo.map((t,k)=>`<label><span class="tx">${esc(t[0])}<small>${esc(t[1])}</small></span><input type="checkbox" data-todo="${k}" ${ck[k]?"checked":""}><span class="ck" aria-hidden="true">✓</span></label>`).join("")}</div>
        ${n===3
          ? `<div class="goal done ${state.just===no?"pop":""}"><span class="seal"><i>✓</i>우리 가게 기준 1개 생김</span><br>${esc(c.day)}</div>`
          : `<div class="goal"><b>세 가지를 마치면</b>${esc(c.day)}</div>`}

        <div class="acc">
          <details ${o!==undefined?"open":""}><summary>많이 하는 오해 O/X</summary><div class="in ox">
            <p class="stmt">${esc(c.ox.s)}</p>
            <div class="b2"><button data-ox="1" class="${o===true?(c.ox.a?"right":"wrong"):""}" aria-pressed="${o===true}">O 맞다</button><button data-ox="0" class="${o===false?(!c.ox.a?"right":"wrong"):""}" aria-pressed="${o===false}">X 아니다</button></div>
            ${o===undefined?"":`<p class="exp"><b>정답 ${c.ox.a?"O":"X"}</b> · ${esc(c.ox.exp)}</p>`}
          </div></details>
          <details><summary>이럴 땐 노무사에게</summary><div class="in"><ul>${c.red.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div></details>
          <details class="sos"><summary>이미 일이 터졌다면</summary><div class="in"><ul>${c.sos.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div></details>
        </div>
        <p class="note">일반적인 기준을 설명한 것으로, 실제 사안은 사실관계에 따라 달라질 수 있습니다.</p>
      </article>
      <div class="nav2">
        <button class="btn line" ${prev?`data-nav="#/c/${prev}"`:"disabled"}>← 이전 답</button>
        <button class="btn line" data-share="${no}">공유</button>
        ${next?`<button class="btn navy" data-nav="#/c/${next}">다음 답 →</button>`:`<button class="btn navy" data-nav="#/board">우리 가게 기준 보기 →</button>`}
      </div></div>
    </div></div>
    ${footer}`;
  }

  function board() {
    const d = doneCount();
    return `${family}${progressBar(`우리 가게 기준 ${d} / ${ORDER.length}`, d, ORDER.length)}
    <div class="stage"><div class="wrap">${sidebar("")}
      <div class="qcard">
        <span class="k">우리 가게 기준</span>
        <h1>${d ? `기준 ${d}개가 섰습니다` : "아직 세운 기준이 없습니다"}</h1>
        <p class="heart">사장님이 부족했던 게 아닙니다. 가게에 기준이 없었을 뿐입니다. 하나씩 세우면 됩니다.</p>
        <ul class="blist">${ORDER.map(no=>{ const c=CARDS[no]; const on=done(no);
          return `<li class="${on?"on":""}"><i>${on?"✓":"·"}</i><div><button data-nav="#/c/${no}" style="all:unset;cursor:pointer"><b>${esc(c.q)}</b></button><small>${on?esc(c.day):"할 일 3개를 마치면 기준이 생깁니다"}</small></div></li>`;}).join("")}</ul>
        <p class="note">이 기록은 지금 쓰시는 기기에만 남습니다. ${d?`<button data-reset="1" style="background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font-size:13px">기록 지우기</button>`:""}</p>
      </div></div></div>
    ${footer}`;
  }

  function ask(q) {
    return `${family}${header()}
    <section><div class="wrap" style="max-width:760px">
      <p class="eyebrow">상담 신청 · 영업일 3일 안에 연락</p>
      <h2>자료 준비 없이,<br>있었던 일만 말씀해 주세요</h2>
      <p class="lead">30분이면 지금 가장 급한 하나가 무엇인지 같이 정할 수 있습니다.</p>
      ${q?`<div class="goal" style="margin-top:20px"><b>보고 계시던 고민</b>“${esc(q)}” — 아래 신청서에 자동으로 함께 전달됩니다.</div>`:""}
      <p class="note" style="margin-top:16px">상담은 유료 자문으로 진행됩니다. 신청서 확인 후 일정과 비용을 먼저 안내드리며, 일정에 따라 노무법인 위너스 소속의 경험 많은 노무사가 먼저 연락드릴 수 있습니다.</p>
      <iframe src="${tallyEmbed(q)}" title="상담 신청서 · 노무법인 위너스" loading="lazy" style="width:100%;height:1250px;border:0;margin-top:18px" frameborder="0"></iframe>
      <p class="note">가게 이름은 쓰지 않으셔도 됩니다.</p>
    </div></section>
    ${footer}`;
  }


  function route() {
    const h = location.hash || "#/";
    const legacy = h.slice(1);
    let html;
    if (CARDS[legacy]) html = card(legacy);                       // 예전 공유 주소 #N-02
    else if (h.startsWith("#/c/") && CARDS[h.slice(4)]) html = card(h.slice(4));
    else if (h.startsWith("#/g/")) html = group(h.slice(4));
    else if (h === "#/board") html = board();
    else if (h.startsWith("#/ask")) { const m = h.match(/q=([^&]+)/); html = ask(m ? decodeURIComponent(m[1]) : ""); }
    else html = home();
    root.innerHTML = html;
    delete state.just;
  }
  const go = (hash, to) => {
    if (location.hash === hash || (!location.hash && hash === "#/")) { route(); }
    else { location.hash = hash; }
    setTimeout(() => {
      const t = to && document.getElementById(to);
      try { t ? t.scrollIntoView({behavior:"smooth"}) : window.scrollTo({top:0}); } catch (e) {}
    }, 0);
  };
  function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

  root.addEventListener("click", (e) => {
    const b = e.target.closest("[data-nav],[data-to],[data-ox],[data-share],[data-reset]"); if (!b) return;
    if (b.dataset.nav || b.dataset.to) { e.preventDefault(); go(b.dataset.nav || "#/", b.dataset.to); return; }
    const no = (location.hash.match(/#\/c\/(.+)/) || [])[1] || location.hash.slice(1);
    if (b.dataset.ox !== undefined) { ox[no] = b.dataset.ox === "1"; route(); return; }
    if (b.dataset.share) {
      const url = location.href.split("#")[0] + "#/c/" + b.dataset.share;
      if (navigator.share) { navigator.share({ title:"사장님 1분 상담소", url }).catch(()=>{}); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast("답 카드 주소를 복사했어요")).catch(()=>toast("주소 복사가 막혀 있어요"));
      else toast("주소 복사가 막혀 있어요");
      return;
    }
    if (b.dataset.reset) { state.checks = {}; save(); route(); }
  });
  root.addEventListener("change", (e) => {
    const k = e.target.dataset.todo; if (k === undefined) return;
    const no = (location.hash.match(/#\/c\/(.+)/) || [])[1] || location.hash.slice(1);
    const ck = state.checks[no] || [false,false,false];
    const was = ck.every(Boolean);
    ck[+k] = e.target.checked; state.checks[no] = ck;
    if (!was && ck.every(Boolean)) state.just = no;
    save(); route();
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
